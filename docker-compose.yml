version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ravenx-backend
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "5000"

  frontend:
    build:
      context: ./tactical-ui
      dockerfile: Dockerfile
    container_name: ravenx-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: ravenx-pipeline
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ./pipeline/data:/app/data
