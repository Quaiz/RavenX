version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ravenx-backend-local
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "5000"

  frontend:
    build:
      context: ./tactical-ui
      dockerfile: Dockerfile
    container_name: ravenx-frontend-local
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
